<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HabitGrid</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="app">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div>
                <h1>HabitGrid</h1>
                <p>Vishv's personal habit tracker</p>
            </div>

            <div
                class="date"
                id="currentDate">
            </div>

        </header>


        <!-- ================= TODAY ================= -->

        <section class="card">

            <div class="section-header">

                <div>
                    <h2>Today's Habits</h2>

                    <p id="todayDate"></p>
                </div>


                <div class="progress">

                    <strong id="progressText">
                        0 / 0
                    </strong>

                    <span>
                        completed
                    </span>

                </div>

            </div>


            <div
                id="todayHabits"
                class="today-habits">
            </div>

        </section>



        <!-- ================= MANAGE HABITS ================= -->

        <section class="card">

            <div class="section-header">

                <div>

                    <h2>My Habits</h2>

                    <p>
                        Manage your habits
                    </p>

                </div>


                <button
                    id="addHabitBtn"
                    class="add-btn">

                    + Add Habit

                </button>

            </div>


            <div
                id="habitList"
                class="habit-list">
            </div>

        </section>



        <!-- ================= HABIT GRAPHS ================= -->

        <section>

            <div class="graphs-header">

                <h2>Habit Activity</h2>

                <p>
                    Your daily completion history
                </p>

            </div>


            <div id="habitGraphs"></div>

        </section>



        <!-- ================= STATISTICS ================= -->

        <section class="stats">

            <div class="stat-card">

                <span>🔥</span>

                <strong id="currentStreak">
                    0
                </strong>

                <p>
                    Current streak
                </p>

            </div>


            <div class="stat-card">

                <span>🏆</span>

                <strong id="longestStreak">
                    0
                </strong>

                <p>
                    Longest streak
                </p>

            </div>


            <div class="stat-card">

                <span>✅</span>

                <strong id="completionRate">
                    0%
                </strong>

                <p>
                    Completion rate
                </p>

            </div>


            <div class="stat-card">

                <span>📅</span>

                <strong id="daysCompleted">
                    0
                </strong>

                <p>
                    Days completed
                </p>

            </div>

        </section>

    </div>



    <!-- ================= HABIT MODAL ================= -->

    <div
        id="habitModal"
        class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add New Habit
                </h2>


                <button
                    id="closeModal"
                    class="close-btn">

                    ×

                </button>

            </div>


            <label for="habitName">
                Habit name
            </label>


            <input
                type="text"
                id="habitName"
                placeholder="e.g. Cycling"
                maxlength="30"
            >


            <label>
                Choose color
            </label>


            <div
                id="colorOptions"
                class="color-options">


                <button
                    class="color-option selected"
                    data-color="#39d353"
                    style="--habit-color:#39d353">
                </button>


                <button
                    class="color-option"
                    data-color="#58a6ff"
                    style="--habit-color:#58a6ff">
                </button>


                <button
                    class="color-option"
                    data-color="#f2cc60"
                    style="--habit-color:#f2cc60">
                </button>


                <button
                    class="color-option"
                    data-color="#bc8cff"
                    style="--habit-color:#bc8cff">
                </button>


                <button
                    class="color-option"
                    data-color="#ff7b72"
                    style="--habit-color:#ff7b72">
                </button>


                <button
                    class="color-option"
                    data-color="#ffa657"
                    style="--habit-color:#ffa657">
                </button>

            </div>


            <button
                id="saveHabitBtn"
                class="save-btn">

                Add Habit

            </button>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
